# Aggiunte per GrumpyScreen (NON fa parte del plugin: GrumpyScreen non legge
# i plugin). Va riportato a mano in /usr/data/opencreator/klipper/config/
# grumpyscreen.cfg: nelle sezioni che esistono gia' cambiare solo le righe
# scritte qui (le altre restano), le sezioni nuove si aggiungono in fondo.
# Poi riavvio dello schermo. Dopo ogni aggiornamento di OpenCreator ricontrollare
# che le modifiche ci siano ancora. STATO: applicato il 05/11/2026 (file
# completo in schermo-stampante/grumpyscreen.cfg, originale salvato sulla
# stampante come grumpyscreen.cfg.originale-opencreator). I pulsanti
# TARA_UGELLO_1..4 per ora NON sono sullo schermo (taratura non in uso).

# Il "Load" del pannello estrusore usa la testina montata e la temperatura
# scelta sullo schermo come base (+30 C, come lo stock).
[default_macros]
load_filament: RC_CARICA TEMP={}

# Nomi in italiano
[monitored_sensor "heater_bed"]
display_name: Piatto
color: blue
controllable: true

[monitored_sensor "heater_generic chamber_heater"]
display_name: Camera
color: orange
controllable: true

[monitored_sensor "extruder"]
display_name: Testina 1
color: red
controllable: true

[monitored_sensor "extruder1"]
display_name: Testina 2
color: orange
controllable: true

[monitored_sensor "extruder2"]
display_name: Testina 3
color: green
controllable: true

[monitored_sensor "extruder3"]
display_name: Testina 4
color: purple
controllable: true

[fan "fan_generic fanM106"]
display_name: Ventola pezzo

[led "led chamber_led"]
display_name: Luce
pwm: false

# Pulsanti (Console -> Macro)
[macro "CARICA_1"]
display_name: Carica testina 1
icon: load_filament

[macro "CARICA_2"]
display_name: Carica testina 2
icon: load_filament

[macro "CARICA_3"]
display_name: Carica testina 3
icon: load_filament

[macro "CARICA_4"]
display_name: Carica testina 4
icon: load_filament

[macro "TARA_UGELLO_1"]
display_name: Tara ugello 1
icon: fine_tune

[macro "TARA_UGELLO_2"]
display_name: Tara ugello 2
icon: fine_tune

[macro "TARA_UGELLO_3"]
display_name: Tara ugello 3
icon: fine_tune

[macro "TARA_UGELLO_4"]
display_name: Tara ugello 4
icon: fine_tune

[macro "RC_STATO"]
display_name: Stato Turbo
icon: info

# Temperature ugello rapide: PLA, PETG, ASA, materiali tecnici
[ui]
extruder_temp_presets: 220, 240, 250, 260, 280
extruder_temp_default: 220

# Colori: per ora quelli di OpenCreator. Per i colori del negozio cambiare
# primary_colour / secondary_colour nella sezione [theme] (formato 0xRRGGBB).
