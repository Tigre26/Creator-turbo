# =============================================================================
# Creator Turbo -- plugin OpenCreator di Riccardo per la Creator 5 Pro
#
# Incluso da printer.cfg ([include plugins/*.cfg]) DOPO la configurazione di
# OpenCreator: le sezioni qui sotto con lo stesso nome di una loro (es.
# [extruder]) ne sostituiscono solo le opzioni scritte qui.
#
# Regole: ogni numero ha il suo motivo accanto; un solo posto per ogni
# parametro (questa sezione); ogni funzione ha il suo interruttore e si
# accende una alla volta, dopo aver misurato.
# STATO: DA PROVARE SULLA MACCHINA. Niente di questo file e' stato ancora
# eseguito su una Creator 5 Pro.
# =============================================================================

[rc_turbo]
# --- Interruttori (True = acceso) -------------------------------------------
# Massimo 2 ugelli in riscaldamento insieme. OpenCreator: "more than two
# hotends heating at once draws too much power and resets the printer"; lo
# stock e Reforge hanno lo stesso limite dentro Klipper, Kalico no.
limite_ugelli: True
# Camera: con riscaldatore al massimo e temperatura in calo lento abbassa il
# target prima del blocco (caso E0077 del 04/11/2026).
guardia_camera: True
# Innesco delle testine in stampa (automatismo fisso, 04/11/2026):
#   1 colore            -> solo la linea di innesco della prima testina
#   piu' colori + torre -> prima testina con la linea, le altre sulla torre
#   piu' colori, torre spenta -> riserva: scivolo + silicone alla prima presa
spurgo_prima_presa: True
# Carico filamento CARICA_1..CARICA_4 e "Load" dello schermo.
# Numerazione per Riccardo: testine 1-4 (dentro Klipper restano T0-T3).
# Acceso il 05/11/2026 per la prima prova (Riccardo).
carico: True
# Z offset dalla tabella tarata del piatto al posto del -0,08 mm fisso.
# Serve anche la tabella: almeno 2 punti con RC_TARA_Z.
tabella_z_piatto: False
# Z offset dalla tabella tarata dell'ugello (per testina) al posto della
# stima (T - 120) x 0,00045. Serve RC_TARA_UGELLO per ogni testina.
tabella_z_ugello: False
# A livellamento spento carica la mesh base "mesh_profilo_riserva" invece di
# "default" (che la mesh adattiva sovrascrive a ogni stampa).
riserva_mesh: False
# Tempo di ogni fase in console e in rc_tempi.csv (cartella config).
tempi: True
# Partenza: OpenCreator scalda la testina di stampa (e una seconda) a 100 C
# durante homing e piatto; qui a 150 C (mai oltre la temperatura di stampa).
# Stesse 2 testine, nel dock: niente carico in piu', niente colature.
# Atteso: 20-30 s in meno a ogni stampa (05/11/2026, da misurare coi tempi).
preriscaldo_partenza: True
preriscaldo_partenza_temp: 150
# Fine stampa: piatto giu' di 50 mm sotto l'ultimo strato, fermandosi al
# limite di OpenCreator (Z 246, 10 mm sopra il fondo corsa) se il pezzo e'
# alto (Riccardo, 05/11/2026). Interruttore "Lower Bed On End" acceso da
# sotto in [creator5_toolchanger]; spegnendolo da Fluidd il piatto non scende.
piatto_giu_fine: True
piatto_giu_mm: 50

# --- Limite ugelli -----------------------------------------------------------
max_ugelli_in_riscaldamento: 2
# Un ugello conta "in riscaldamento" finche' e' sotto il target di piu' di
# 5 C: vicino al target la potenza cala (stessa scala dei -2 C delle attese
# di OpenCreator).
banda_riscaldamento: 5

# --- Guardia camera ----------------------------------------------------------
camera_riscaldatore: chamber_heater
# "Al massimo" = potenza >= 95 % di max_power (0,8 in OpenCreator).
camera_saturazione: 0.95
# Interviene 1 C prima che verify_heater inizi a contare (target - isteresi).
camera_anticipo: 1
# Condizione presente da almeno 20 s: a 1 C sotto, verify_heater
# (max_error 100) accumula circa 1 al secondo, quindi c'e' margine.
camera_conferma_s: 20
# Calo oltre 2 C al minuto = possibile guasto (sonda staccata): non si tocca
# niente e decide verify_heater. La stanza fredda fa calare lentamente
# (65 -> 57 C in alcuni minuti).
camera_calo_max_c_min: 2
# Al massimo 10 C sotto il target dello slicer, mai sotto 45 C (sotto i 45 C
# la camera non aiuta piu' l'ASA: oltre conviene fermarsi).
camera_riduzione_max: 10
camera_minimo: 45

# --- Spurgo ai cambi (solo con torre spenta) --------------------------------
# Prima presa: 25 mm (lo stock ne fa 50, Riccardo: "la meta' basta").
spurgo_prima_mm: 25
# Prese successive senza torre: ipotesi 10-15 mm, si parte da 12.
spurgo_cambio_mm: 12
# 3 mm/s = purge_speed di OpenCreator.
spurgo_velocita: 3
# Prima di andare allo scivolo in stampa la testina sale di 2 mm: niente
# strisciate sul pezzo.
alzata_cambio: 2

# --- Pulizia sul silicone (davanti a destra, coordinate di OpenCreator) -----
# 0 passate = l'ugello si appoggia e risale, come lo stock. Prima di mettere
# passate guarda il silicone con RC_PROVA_PULIZIA e misura la larghezza.
pulizia_passate: 0
pulizia_dx: 5
pulizia_velocita: 3000
# Pulizia a caldo, ventola spenta. Se resta il filo: ventola 0.6 (come
# OpenCreator) o raffreddamento breve (gradi da togliere, poi riscalda).
pulizia_ventola: 0
pulizia_raffredda: 0
# Quota minima di uscita dal silicone: cooldown_lift_z di OpenCreator.
pulizia_quota_uscita: 10

# --- Carico filamento --------------------------------------------------------
# Stock: temperatura della tabella materiale + 30 C, 295 mm a 4 mm/s.
carico_aumento: 30
carico_temp_max: 300
# 295 mm totali come lo stock finche' non misuriamo sensore -> ugello.
# Tratto veloce a 5 mm/s: ~12 mm3/s, si fonde anche se il filamento arriva
# all'ugello prima del previsto. Tratto finale lento = spurgo a 3 mm/s.
carico_veloce_mm: 250
carico_veloce_v: 5
carico_lento_mm: 45
carico_lento_v: 3
# Se il filamento non c'e' scalda e aspetta 2 minuti che lo inserisci.
carico_attesa_s: 120
# Dopo il rilevamento aspetta 3 s: il tempo di spingerlo fino agli
# ingranaggi (da verificare).
carico_inserimento_s: 3
# Non piu' usato (05/11/2026): il carico finisce con C5_COOL_FOR_DOCK di
# OpenCreator, che raffredda sulla spazzola prima di posare la testina.
carico_raffredda: 0
# Temperature materiale della tabella stock (note Reforge 47).
temperature_materiali: DEFAULT:220, PLA:220, PETG:240, PLA-CF:220,
    PETG-CF:240, ABS:250, ASA:250, SILK:220, PET-CF:270, PAHT-CF:280,
    S-PAHT:280, S-MULTI:270, PA-CF:270, HIPS:250, PVA:220, TPU:220, PC:260,
    PA:260, PC-ABS:260, PPS-CF:290

# --- Taratura Z per temperatura del piatto (RC_TARA_Z) ----------------------
# 5 minuti di stabilizzazione: lo stesso soak dello stock prima della mesh.
tara_soak_s: 300
# Ugello a 220 C (PLA) per il quadrato: il termine dell'ugello resta quello
# di OpenCreator, cambia solo il piatto.
tara_ugello: 220
# Quadrato 30 x 30 mm, linee 0,5 mm, layer 0,2 mm, 25 mm/s: ~70 s di
# stampa, il tempo di regolare con il baby-step mentre stampa.
tara_lato_mm: 30
tara_linea_mm: 0.5
tara_layer_mm: 0.2
tara_velocita: 25
# Recupera i 5 mm ritratti da C5_TOOL_PURGE (G1 E-5).
tara_recupero_mm: 5
tara_filamento_mm: 1.75

# --- Taratura Z dell'ugello (RC_TARA_UGELLO) --------------------------------
# 220 (PLA), 260 (ASA), 300 (massimo che si usera'): in mezzo il plugin
# interpola, fuori usa il punto piu' vicino.
tara_ugello_temperature: 220, 260, 300
# 1 minuto a temperatura: si scalda tutto il blocco, non solo il sensore.
tara_ugello_soak_s: 60
# 3 tocchi per temperatura, scartati se differiscono di piu' di 0,02 mm.
tara_ugello_tocchi: 3
tara_ugello_scarto_tocchi: 0.02
# Freddo iniziale e finale devono coincidere entro 0,01 mm: altrimenti si
# e' mosso o scaldato qualcosa e la taratura si scarta.
tara_ugello_scarto_freddo: 0.01
# "Freddo" finale = temperatura di partenza + 5 C (0,00045 x 5 = 0,002 mm).
tara_ugello_margine_freddo: 5
# Consigliato SENZA filamento: niente spurgo, solo passata sul silicone
# prima di ogni tocco. Se il filamento c'e': 10 mm di spurgo + ritrazione di
# 5 mm di OpenCreator + passata.
tara_ugello_spurgo_mm: 10
# Promemoria a inizio stampa dopo 500 ore di stampa di quella testina dalla
# sua taratura (valore di partenza, da rivedere con l'esperienza; 0 = mai).
# Va rifatta comunque quando si cambia l'ugello, solo su quella testina.
tara_ugello_promemoria_ore: 500

# --- Mesh ------------------------------------------------------------------
mesh_profilo_riserva: rc_base
# Linea di innesco (KAMP): 20 mm di filamento, valore di OpenCreator. Per
# allungarla togli i # dalle due righe in fondo al file.
mesh_base_soak_s: 300

# Attesa piatto piu' lunga per ASA/ABS: da 80 C in su 90 s invece dei 30 s
# impostati sotto in [creator5_toolchanger] (Riccardo, 05/11/2026: "per
# sicurezza", a 100-110 C il piatto si assesta piu' lentamente).
attesa_piatto_caldo_da: 80
attesa_piatto_caldo_s: 90

# =============================================================================
# Limiti di temperatura (sostituiscono quelli di OpenCreator: 350/130/80 C)
# Ugelli 320 C: oltre il termistore 3950 non e' affidabile (serve PT1000).
# Piatto 125 C, camera 70 C: oltre 70 C la griglia si deforma (doc OpenCreator).
# Controlla con RC_STATO che siano applicati.
# =============================================================================
[extruder]
max_temp: 320
[extruder1]
max_temp: 320
[extruder2]
max_temp: 320
[extruder3]
max_temp: 320
[heater_bed]
max_temp: 125
[heater_generic chamber_heater]
max_temp: 70

# =============================================================================
# Cambio testina: via di mezzo (decisione 05/11/2026)
# OpenCreator: accelerazione 30000 e spostamenti in aria a 600 mm/s, cambio ~3 s.
# Stock: accelerazione 8000, ~6-7 s. Qui meta' accelerazione e meta' velocita'
# solo nei tratti in aria: meno scossoni su dock e testine posate e meno danni
# in caso di urto, perdendo circa 1 s a cambio. I tratti vicino al dock
# (avvicinamento 90, aggancio 90, sfilamento 160 mm/s) restano quelli di
# OpenCreator. Per tornare ai loro valori: commentare queste righe.
# =============================================================================
[creator5_toolchanger]
pickup_accel: 15000
post_select_accel: 15000
clear_travel_speed: 300
pickup_predock_speed: 300
departure_speed: 300
pickup_departure_speed: 300
# Attesa di stabilizzazione del piatto: 30 s invece di 2 min, da 50 C in su
# (PLA, PETG); sotto i 50 C nessuna attesa; da 80 C in su 90 s, vedi
# attesa_piatto_caldo_* in [rc_turbo] (Riccardo, 05/11/2026).
# OpenCreator: da 45 C, 2 min. Da verificare sul primo layer della prima
# stampa ASA: se la mesh esce storta o il primo layer cambia tra inizio e
# fine piatto, allungare.
bed_soak_min_temp: 50
bed_soak_minutes: 0.5
# Piatto giu' a fine stampa (quanto: piatto_giu_mm in [rc_turbo]).
lower_bed_on_end_default: True

# =============================================================================
# DA ATTIVARE DOPO LE MISURE (togli i # una sezione alla volta)
# =============================================================================
# Sonda: 1 tocco per punto se RC_PROVA_SONDA da' un range sotto 0,01 mm.
#[probe]
#samples: 1
#
# Protezione surriscaldamento piu' stretta prima di provare temperature alte.
# OpenCreator: max_error 400, check_gain_time 4000 s (molto larghi). Valori da
# decidere guardando le curve di riscaldamento reali in Fluidd.
#[verify_heater extruder]
#max_error: 120
#check_gain_time: 60
#heating_gain: 2

# =============================================================================
# Macro
# =============================================================================

# --- Spurgo al cambio testina (chiamata da rc_turbo dopo C5_TOOL_SELECT) ----
[gcode_macro _RC_SPURGO_CAMBIO]
description: Scivolo, riscaldo, spurgo, pulizia (uso interno)
gcode:
  {% set s = printer.rc_turbo %}
  {% set t = params.T|int %}
  {% set heater = 'extruder' if t == 0 else 'extruder' ~ t %}
  {% set temp = params.TEMP|float %}
  {% set room = printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float %}
  {% set hop = [s.alzata_cambio|float, room]|min %}
  SAVE_GCODE_STATE NAME=rc_spurgo_cambio
  {% if hop > 0 %}
    G91
    G1 Z{hop} F600
  {% endif %}
  G90
  # Allo scivolo PRIMA di scaldare: le gocce cadono li', non sul pezzo
  C5_MOVE_TO_PURGE_BUCKET
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET={temp}
  TEMPERATURE_WAIT SENSOR={heater} MINIMUM={temp - 2}
  C5_TOOL_PURGE LENGTH={params.LENGTH|float} SPEED={s.spurgo_velocita}
  _RC_PULISCI
  RESTORE_GCODE_STATE NAME=rc_spurgo_cambio MOVE=0

# --- Pulizia sul silicone ---------------------------------------------------
# Percorso di OpenCreator (C5_COOL_FOR_DOCK): dallo scivolo rientra a
# X/Y prep_approach, scende in Y fino al silicone, poi va in X. Mai sopra i
# dock. Quota: mai sotto quella attuale (in stampa e' sopra il pezzo).
[gcode_macro _RC_PULISCI]
description: Passata sul silicone davanti a destra (uso interno)
gcode:
  {% set s = printer.rc_turbo %}
  {% set c = printer.configfile.settings.creator5_toolchanger %}
  {% set ax = c.prep_approach_x|default(250)|float %}
  {% set ay = c.prep_approach_y|default(250)|float %}
  {% set cx = c.cooldown_x|default(266.5)|float %}
  {% set cy = c.cooldown_y|default(13.8)|float %}
  {% set wz = c.cooldown_wipe_z|default(1.7)|float %}
  {% set passate = params.PASSATE|default(s.pulizia_passate)|int %}
  {% set dx = params.DX|default(s.pulizia_dx)|float %}
  {% set feed = s.pulizia_velocita|float %}
  {% set z_uscita = [printer.gcode_move.gcode_position.z|float, s.pulizia_quota_uscita|float]|max %}
  {% set heater = printer.toolhead.extruder %}
  {% set temp = printer[heater].target|float %}
  {% set raffredda = params.RAFFREDDA|default(s.pulizia_raffredda)|float %}
  {% set ventola = params.VENTOLA|default(s.pulizia_ventola)|float %}
  {% set ventola_prima = printer['fan_generic fanM106'].speed|float %}
  SAVE_GCODE_STATE NAME=rc_pulisci
  G90
  G1 Z{z_uscita} F600
  G1 X{ax} Y{ay} F6000
  G1 Y{cy} F6000
  G1 X{cx} F3000
  G1 Z{wz} F600
  SET_FAN_SPEED FAN=fanM106 SPEED={ventola}
  {% for i in range(passate) %}
    G1 X{cx - dx} F{feed}
    G1 X{cx + dx} F{feed}
  {% endfor %}
  {% if passate > 0 %}
    G1 X{cx} F{feed}
  {% endif %}
  {% if raffredda > 0 and temp > raffredda %}
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET={temp - raffredda}
    TEMPERATURE_WAIT SENSOR={heater} MAXIMUM={temp - raffredda + 3}
  {% endif %}
  G1 Z{z_uscita} F600
  SET_FAN_SPEED FAN=fanM106 SPEED={ventola_prima}
  {% if raffredda > 0 and temp > raffredda and params.RIPRISTINA|default(1)|int %}
    SET_HEATER_TEMPERATURE HEATER={heater} TARGET={temp}
    TEMPERATURE_WAIT SENSOR={heater} MINIMUM={temp - 2}
  {% endif %}
  RESTORE_GCODE_STATE NAME=rc_pulisci MOVE=0

[gcode_macro RC_PROVA_PULIZIA]
description: A freddo, TESTINA=1..4: porta la testina sul silicone, per vedere posizione e passate
gcode:
  {% set t = params.TESTINA|default(1)|int - 1 %}
  {% if t not in [0, 1, 2, 3] %}
    { action_raise_error("TESTINA=1..4") }
  {% endif %}
  {% set heater = 'extruder' if t == 0 else 'extruder' ~ t %}
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    { action_raise_error("Non durante una stampa") }
  {% endif %}
  {% if printer.toolhead.homed_axes != 'xyz' %}
    C5_HOME_FOR_PRINT
  {% endif %}
  AFC_SELECT_TOOL TOOL={heater}
  C5_AUTO_NOZZLE_Z T={t} HOTEND=120 BED=0 FIRST_LAYER_HEIGHT=0.2
  _RC_PULISCI PASSATE={params.PASSATE|default(printer.rc_turbo.pulizia_passate)} DX={params.DX|default(printer.rc_turbo.pulizia_dx)} VENTOLA=0 RAFFREDDA=0
  AFC_UNSELECT_TOOL

# --- Carico filamento -------------------------------------------------------
[gcode_macro RC_CARICA]
description: Carica il filamento: TOOL=n (o testina montata), TEMP= o materiale AFC
gcode:
  {% set s = printer.rc_turbo %}
  {% if not s.carico %}
    { action_raise_error("Carico Creator Turbo spento: carico: True in [rc_turbo]") }
  {% endif %}
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    { action_raise_error("Non durante una stampa: con la stampa in pausa usa il carico di OpenCreator") }
  {% endif %}
  {% set tc = printer.creator5_toolchanger %}
  {% set montata = tc.active_tool if tc.active_tool is not none else -1 %}
  {% set tool = params.TOOL|default(montata)|int %}
  {% if tool not in [0, 1, 2, 3] %}
    { action_raise_error("Indica la testina: CARICA_1..CARICA_4 (nessuna testina montata)") }
  {% endif %}
  # Materiale: parametro, altrimenti quello impostato sulla bobina (AFC)
  {% set mat = namespace(nome=params.MATERIAL|default('')|string|upper) %}
  {% if not mat.nome and 'AFC' in printer %}
    {% for lane_name in printer.AFC.lanes %}
      {% for prefix in ['AFC_lane ', 'AFC_stepper '] %}
        {% if (prefix ~ lane_name) in printer %}
          {% set lane = printer[prefix ~ lane_name] %}
          {% if (lane.extruder or '')|string|last == tool|string and lane.material %}
            {% set mat.nome = lane.material|string|upper %}
          {% endif %}
        {% endif %}
      {% endfor %}
    {% endfor %}
  {% endif %}
  {% set tabella = s.temperature_materiali %}
  {% if params.TEMP|default(0)|float > 0 %}
    {% set base = params.TEMP|float %}
  {% else %}
    {% set base = tabella[mat.nome]|default(tabella['DEFAULT'])|float %}
  {% endif %}
  {% set temp = [base + s.carico_aumento|float, s.carico_temp_max|float]|min %}
  { action_respond_info("Carico testina %d: %s, %.0f C (base %.0f + %.0f)" % (tool + 1, mat.nome or "materiale non indicato", temp, base, s.carico_aumento)) }
  _RC_CARICA_ESEGUI TOOL={tool} TEMP={temp}

[gcode_macro _RC_CARICA_ESEGUI]
gcode:
  {% set s = printer.rc_turbo %}
  {% set tool = params.TOOL|int %}
  {% set temp = params.TEMP|float %}
  {% set heater = 'extruder' if tool == 0 else 'extruder' ~ tool %}
  {% if printer.toolhead.homed_axes != 'xyz' %}
    C5_HOME_FOR_PRINT
  {% endif %}
  AFC_SELECT_TOOL TOOL={heater}
  # Stesso controllo dei sensori del carico di OpenCreator
  C5_CHECK_LOAD_TOOL T={tool}
  # Allo scivolo prima di scaldare (stock: X275 Y254, qui le coordinate di OpenCreator)
  C5_MOVE_TO_PURGE_BUCKET
  C5_AUTO_NOZZLE_Z T={tool} HOTEND={temp} BED={printer.heater_bed.target|float} FIRST_LAYER_HEIGHT=0.2
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET={temp}
  RC_ATTENDI_FILAMENTO T={tool}
  TEMPERATURE_WAIT SENSOR={heater} MINIMUM={temp - 2}
  C5_TOOL_PURGE LENGTH={s.carico_veloce_mm} SPEED={s.carico_veloce_v}
  C5_TOOL_PURGE LENGTH={s.carico_lento_mm} SPEED={s.carico_lento_v}
  # Fine come il carico di OpenCreator: raffredda sulla spazzola (fino a
  # temperatura - 100 C) e solo dopo spegne e posa la testina, cosi' nel dock
  # non cola.
  C5_COOL_FOR_DOCK HOTEND={temp}
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET=0
  AFC_UNSELECT_TOOL
  RC_VERIFICA_FILAMENTO T={tool}

[gcode_macro _RC_CARICA_ANNULLA]
gcode:
  {% set t = params.T|int %}
  SET_HEATER_TEMPERATURE HEATER={'extruder' if t == 0 else 'extruder' ~ t} TARGET=0
  AFC_UNSELECT_TOOL

[gcode_macro CARICA_1]
description: Carica filamento nella testina 1
gcode:
  RC_CARICA TOOL=0 {rawparams}

[gcode_macro CARICA_2]
description: Carica filamento nella testina 2
gcode:
  RC_CARICA TOOL=1 {rawparams}

[gcode_macro CARICA_3]
description: Carica filamento nella testina 3
gcode:
  RC_CARICA TOOL=2 {rawparams}

[gcode_macro CARICA_4]
description: Carica filamento nella testina 4
gcode:
  RC_CARICA TOOL=3 {rawparams}

# --- Taratura Z per temperatura del piatto -------------------------------------
# Uso: RC_TARA_Z TEMP=60 -> guarda il quadrato mentre stampa, correggi con il
# baby-step di Fluidd -> RC_TARA_Z_QUADRATO per rifarlo a fianco se serve ->
# RC_TARA_Z_SALVA. Punti: 60 (PLA) e 110 (ASA), le temperature usate.
[gcode_macro _RC_TARA_Z_ESEGUI]
gcode:
  {% set s = printer.rc_turbo %}
  {% set bed = params.TEMP|float %}
  {% set tool = params.TOOL|int %}
  {% set hotend = params.HOTEND|float %}
  {% set heater = 'extruder' if tool == 0 else 'extruder' ~ tool %}
  {% set m = printer.configfile.settings.bed_mesh %}
  {% set lato = s.tara_lato_mm|float %}
  {% set cx = (m.mesh_min[0]|float + m.mesh_max[0]|float) / 2 %}
  {% set cy = (m.mesh_min[1]|float + m.mesh_max[1]|float) / 2 %}
  {% set x0 = cx - lato / 2 %}
  {% set y0 = cy - lato / 2 %}
  {% if bed >= 30 %}
    M140 S{bed}
  {% else %}
    M140 S0
  {% endif %}
  C5_HOME_FOR_PRINT
  {% if bed >= 30 %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
    RC_ATTESA SECONDI={params.SOAK|float} MOTIVO="Stabilizzazione piatto"
  {% endif %}
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE MESH_MIN={x0 - 15},{y0 - 15} MESH_MAX={x0 + lato + 15},{y0 + lato + 15} PROBE_COUNT=3,3
  AFC_SELECT_TOOL TOOL={heater}
  C5_MOVE_TO_PURGE_BUCKET
  C5_AUTO_NOZZLE_Z T={tool} HOTEND={hotend} BED={bed} FIRST_LAYER_HEIGHT={s.tara_layer_mm}
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET={hotend}
  TEMPERATURE_WAIT SENSOR={heater} MINIMUM={hotend - 2}
  C5_TOOL_PURGE LENGTH={s.spurgo_prima_mm}
  _RC_PULISCI
  C5_VERIFY_NOZZLE_Z
  _RC_QUADRATO X={x0} Y={y0} RECUPERO={s.tara_recupero_mm}
  { action_respond_info("Taratura piatto %.0f C: guarda il quadrato. Correggi con il baby-step (Z +/-), poi RC_TARA_Z_QUADRATO per rifarlo a fianco, infine RC_TARA_Z_SALVA (o RC_TARA_Z_ANNULLA)." % bed) }

[gcode_macro RC_TARA_Z_QUADRATO]
description: Ristampa il quadrato di taratura spostato di DX mm (default 35)
gcode:
  {% set s = printer.rc_turbo %}
  {% if not s.taratura_attiva %}
    { action_raise_error("Nessuna taratura in corso: RC_TARA_Z TEMP=...") }
  {% endif %}
  {% set m = printer.configfile.settings.bed_mesh %}
  {% set lato = s.tara_lato_mm|float %}
  {% set cx = (m.mesh_min[0]|float + m.mesh_max[0]|float) / 2 %}
  {% set cy = (m.mesh_min[1]|float + m.mesh_max[1]|float) / 2 %}
  {% set dx = params.DX|default(35)|float %}
  {% set dy = params.DY|default(0)|float %}
  C5_VERIFY_NOZZLE_Z
  _RC_QUADRATO X={cx - lato / 2 + dx} Y={cy - lato / 2 + dy} RECUPERO=1

[gcode_macro _RC_QUADRATO]
gcode:
  {% set s = printer.rc_turbo %}
  {% set x0 = params.X|float %}
  {% set y0 = params.Y|float %}
  {% set lato = s.tara_lato_mm|float %}
  {% set w = s.tara_linea_mm|float %}
  {% set h = s.tara_layer_mm|float %}
  {% set r = s.tara_filamento_mm|float / 2 %}
  {% set e_mm = w * h / (3.14159265 * r * r) %}
  {% set f = s.tara_velocita|float * 60 %}
  {% set linee = (lato / w)|int %}
  SAVE_GCODE_STATE NAME=rc_quadrato
  G90
  M83
  SET_FAN_SPEED FAN=fanM106 SPEED=0
  G1 Z5 F600
  G1 X{x0 - 8} Y{y0} F6000
  G1 Z{h} F600
  G1 E{params.RECUPERO|default(0)|float} F300
  G1 X{x0} E{8 * e_mm} F{f}
  {% for i in range(linee) %}
    {% set y = y0 + i * w %}
    {% if i % 2 == 0 %}
      G1 X{x0 + lato} Y{y} E{lato * e_mm} F{f}
    {% else %}
      G1 X{x0} Y{y} E{lato * e_mm} F{f}
    {% endif %}
    {% if not loop.last %}
      G1 Y{y + w} E{w * e_mm} F{f}
    {% endif %}
  {% endfor %}
  G1 E-1 F1800
  G1 Z5 F600
  RESTORE_GCODE_STATE NAME=rc_quadrato MOVE=0

[gcode_macro _RC_TARA_Z_FINE]
gcode:
  {% set room = printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float %}
  {% set hop = [10.0, room]|min %}
  {% if hop > 0 %}
    SAVE_GCODE_STATE NAME=rc_tara_fine
    G91
    G1 Z{hop} F600
    RESTORE_GCODE_STATE NAME=rc_tara_fine MOVE=0
  {% endif %}
  {% set heater = printer.toolhead.extruder %}
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET=0
  {% if printer.creator5_toolchanger.active_tool is not none %}
    AFC_UNSELECT_TOOL
  {% endif %}
  BED_MESH_CLEAR

# --- Taratura Z dell'ugello sul piattello -----------------------------------
# Uso: filamento tolto, C5_HOME_FOR_PRINT, piatto spento e freddo, poi togli
# il piatto e RC_TARA_UGELLO TOOL=2 BUILDPLATE_REMOVED=1 (solo la testina a
# cui hai cambiato l'ugello), oppure TOOLS=0,2 o TOOLS=ALL per piu' testine
# una dopo l'altra. Punta pulita prima di partire.
# Pulsanti per schermo e Fluidd: procedura guidata a finestre (come le
# finestre di OpenCreator), passo per passo. In piu' la sonda controlla che
# il piatto sia davvero tolto prima di toccare.
[gcode_macro TARA_UGELLO_1]
description: Taratura Z ugello della testina 1, guidata
gcode:
  _RC_TU_PASSO PASSO=inizio T=0

[gcode_macro TARA_UGELLO_2]
description: Taratura Z ugello della testina 2, guidata
gcode:
  _RC_TU_PASSO PASSO=inizio T=1

[gcode_macro TARA_UGELLO_3]
description: Taratura Z ugello della testina 3, guidata
gcode:
  _RC_TU_PASSO PASSO=inizio T=2

[gcode_macro TARA_UGELLO_4]
description: Taratura Z ugello della testina 4, guidata
gcode:
  _RC_TU_PASSO PASSO=inizio T=3

[gcode_macro TARA_UGELLO_TUTTE]
description: Taratura Z ugello di tutte le testine, guidata
gcode:
  _RC_TU_PASSO PASSO=inizio T=ALL

[gcode_macro _RC_TU_PASSO]
gcode:
  {% set t = params.T|default('0')|string|upper %}
  {% set passo = params.PASSO|default('inizio')|string %}
  {% set nome = 'tutte le testine' if t == 'ALL' else 'testina ' ~ (t|int + 1) %}
  {% set testine = [0, 1, 2, 3] if t == 'ALL' else [t|int] %}
  {% set carichi = namespace(lista=[]) %}
  {% for i in testine %}
    {% set sensore = 'filament_switch_sensor extruder' ~ i ~ '_tool_start' %}
    {% if sensore in printer and printer[sensore].filament_detected %}
      {% set carichi.lista = carichi.lista + ['testina ' ~ (i + 1)] %}
    {% endif %}
  {% endfor %}
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    { action_raise_error("Non durante una stampa") }
  {% endif %}
  {% if passo == 'inizio' %}
    RESPOND TYPE=command MSG="action:prompt_begin Taratura ugello {nome} (1/3)"
    RESPOND TYPE=command MSG="action:prompt_text Una volta sola, o quando cambi un ugello. Dura circa 20 minuti per testina."
    {% if carichi.lista %}
      RESPOND TYPE=command MSG="action:prompt_text ATTENZIONE: filamento presente in {carichi.lista|join(', ')}. Taglialo e sfilalo prima di continuare (consigliato)."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text Il piatto per ora RESTA MONTATO: serve per l'homing. Premi Homing."
    RESPOND TYPE=command MSG="action:prompt_footer_button Annulla|_RC_TU_PASSO PASSO=annulla T={t}|error"
    RESPOND TYPE=command MSG="action:prompt_footer_button Homing|_RC_TU_PASSO PASSO=homing T={t}|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif passo == 'homing' %}
    RESPOND TYPE=command MSG="action:prompt_end"
    M140 S0
    C5_HOME_FOR_PRINT
    _RC_TU_PASSO PASSO=togli T={t}
  {% elif passo == 'togli' %}
    RESPOND TYPE=command MSG="action:prompt_begin Taratura ugello {nome} (2/3)"
    RESPOND TYPE=command MSG="action:prompt_text Homing fatto. ORA TOGLI IL PIATTO (la lastra di stampa), poi premi Continua."
    {% if printer.heater_bed.temperature|float > 35 %}
      RESPOND TYPE=command MSG="action:prompt_text Il piatto e' a {printer.heater_bed.temperature|round|int} C: aspetta che scenda sotto 35 C (la taratura lo controlla)."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Annulla|_RC_TU_PASSO PASSO=annulla T={t}|error"
    RESPOND TYPE=command MSG="action:prompt_footer_button Piatto tolto, Continua|_RC_TU_PASSO PASSO=via T={t}|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif passo == 'via' %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if t == 'ALL' %}
      RC_TARA_UGELLO TOOLS=ALL BUILDPLATE_REMOVED=1 GUIDATA=1
    {% else %}
      RC_TARA_UGELLO TOOL={t} BUILDPLATE_REMOVED=1 GUIDATA=1
    {% endif %}
  {% elif passo == 'fine' %}
    RESPOND TYPE=command MSG="action:prompt_begin Taratura ugello (3/3)"
    RESPOND TYPE=command MSG="action:prompt_text {params.ESITO|default('Finita')}"
    RESPOND TYPE=command MSG="action:prompt_text RIMONTA IL PIATTO prima della prossima stampa."
    RESPOND TYPE=command MSG="action:prompt_footer_button Piatto rimontato|_RC_TU_PASSO PASSO=chiudi T={t}|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_end"
  {% endif %}

[gcode_macro _RC_TARA_UGELLO_SCALDA]
gcode:
  {% set s = printer.rc_turbo %}
  {% set t = params.T|int %}
  {% set temp = params.TEMP|float %}
  {% set heater = 'extruder' if t == 0 else 'extruder' ~ t %}
  # Scalda sopra lo scivolo: le gocce non cadono sul piattello
  C5_MOVE_TO_PURGE_BUCKET
  C5_AUTO_NOZZLE_Z T={t} HOTEND={temp} BED=0 FIRST_LAYER_HEIGHT=0.2
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET={temp}
  {% if printer[heater].temperature|float > temp + 3 %}
    # Gradino in discesa: ventola per scendere, poi spenta per l'attesa
    SET_FAN_SPEED FAN=fanM106 SPEED=1
    TEMPERATURE_WAIT SENSOR={heater} MAXIMUM={temp + 2}
    SET_FAN_SPEED FAN=fanM106 SPEED=0
  {% endif %}
  TEMPERATURE_WAIT SENSOR={heater} MINIMUM={temp - 1} MAXIMUM={temp + 2}
  RC_ATTESA SECONDI={params.SOAK|float} MOTIVO="Ugello a regime"
  {% if params.SPURGO|default(1)|int %}
    C5_TOOL_PURGE LENGTH={s.tara_ugello_spurgo_mm}
  {% endif %}
  _RC_PULISCI

[gcode_macro _RC_TARA_UGELLO_RAFFREDDA]
gcode:
  {% set t = params.T|int %}
  SET_HEATER_TEMPERATURE HEATER={'extruder' if t == 0 else 'extruder' ~ t} TARGET=0
  C5_MOVE_TO_PURGE_BUCKET
  SET_FAN_SPEED FAN=fanM106 SPEED=1

# --- Mesh ------------------------------------------------------------------
[gcode_macro RC_MESH_BASE]
description: Mesh completa a piatto stabile, salvata come profilo di riserva (poi SAVE_CONFIG)
gcode:
  {% set s = printer.rc_turbo %}
  {% set bed = params.BED|default(60)|float %}
  {% set soak = params.SOAK|default(s.mesh_base_soak_s)|float %}
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    { action_raise_error("Non durante una stampa") }
  {% endif %}
  M140 S{bed}
  C5_HOME_FOR_PRINT
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
  RC_ATTESA SECONDI={soak} MOTIVO="Stabilizzazione piatto"
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE
  BED_MESH_PROFILE SAVE={s.mesh_profilo_riserva}
  { action_respond_info("Mesh base salvata come '%s' a %.0f C (solo in memoria). Guardala in Fluidd > Heightmap; se va bene lancia SAVE_CONFIG (riavvia Klipper)." % (s.mesh_profilo_riserva, bed)) }

[gcode_macro RC_PROVA_SONDA]
description: 10 letture della sonda al centro: decide se basta 1 tocco per punto
gcode:
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    { action_raise_error("Non durante una stampa") }
  {% endif %}
  {% set m = printer.configfile.settings.bed_mesh %}
  {% set p = printer.configfile.settings.probe %}
  {% set cx = (m.mesh_min[0]|float + m.mesh_max[0]|float) / 2 %}
  {% set cy = (m.mesh_min[1]|float + m.mesh_max[1]|float) / 2 %}
  {% if printer.toolhead.homed_axes != 'xyz' %}
    C5_HOME_FOR_PRINT
  {% endif %}
  {% if printer.creator5_toolchanger.active_tool is not none %}
    AFC_UNSELECT_TOOL
  {% endif %}
  G90
  G1 Z10 F600
  G1 X{cx - p.x_offset|default(0)|float} Y{cy - p.y_offset|default(0)|float} F6000
  PROBE_ACCURACY SAMPLES=10
  { action_respond_info("Se 'range' e' sotto 0,01 mm si puo' provare [probe] samples: 1 in creator-turbo.cfg") }

